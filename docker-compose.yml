version: '3.8'

services:
  # Banco de dados
  postgres:
    image: postgres:16.11
    container_name: librarydb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: library
    networks:
      - library-network

  # PgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    ports:
      - "15432:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    networks:
      - library-network

networks:
  library-network:
    driver: bridge